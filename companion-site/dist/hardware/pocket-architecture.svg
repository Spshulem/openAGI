<rect x="60" y="220" width="288" height="120" rx="18" fill="#d9cbd9"/><text x="88" y="274" font-size="23" fill="#242126">1.5″ RGB OLED</text><text x="88" y="306" font-size="15" fill="#504a50">SPI · 44.5 × 37 mm PCB</text>
<rect x="60" y="355" width="288" height="75" rx="18" fill="#d9cbd9"/><text x="88" y="401" font-size="22" fill="#242126">One tactile switch</text>
<rect x="850" y="175" width="195" height="90" rx="18" fill="#d9cbd9"/><text x="875" y="211" font-size="20" fill="#242126">Wi-Fi / BLE</text><text x="875" y="239" font-size="14" fill="#504a50">phone or service</text>
<rect x="850" y="305" width="195" height="100" rx="18" fill="#d9cbd9"/><text x="875" y="340" font-size="19" fill="#242126">I²S amplifier</text><text x="875" y="370" font-size="15" fill="#504a50">→ 8 Ω speaker</text>
