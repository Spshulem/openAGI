<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
<title id="title">OpenAGI Pocket prototype system wiring map</title><desc id="desc">Logical block diagram for an off-the-shelf XIAO ESP32-S3 Sense prototype with camera, microphone, OLED, I2S amplifier, speaker, switch, battery, USB-C, Wi-Fi, BLE and external agent services. Pin allocation and power details are not yet verified.</desc>
<rect width="1100" height="720" fill="#eeeae1"/><text x="60" y="75" font-family="Arial,sans-serif" font-size="38" fill="#242126">OpenAGI Pocket / prototype wiring map</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="16" fill="#625b63">Logical connections only · not an electrical schematic · pin allocation and power path require bench validation</text>
<g fill="none" stroke="#766b78" stroke-width="3"><path d="M348 280H470M348 385H470M740 220H850M740 355H850M740 490H850M600 555V615M600 140V185"/></g>
