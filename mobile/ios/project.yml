name: OpenAGI
options:
  bundleIdPrefix: sh.openagi
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    # Ad-hoc signing ("-" needs no Apple Developer Team, certificate, or
    # provisioning profile — it works on any Mac, headless or not) rather
    # than disabling signing outright. A live Task 16 end-to-end pairing run
    # found that CODE_SIGNING_ALLOWED: NO makes the installed app carry an
    # EMPTY entitlements dictionary (entitlements are only embedded as part
    # of a code signature), so Credentials.save()'s SecItemAdd unconditionally
    # failed with errSecMissingEntitlement (-34018) — pairing could never
    # complete, on Simulator or (since real devices require signing to
    # install at all) on real hardware either.
    #
    # Ad-hoc signing does NOT actually get the declared keychain-access-groups
    # / application-groups entries embedded either — `codesign -d
    # --entitlements` on the built app still shows an empty dict, even signed
    # this way, without a real Team ID. What ad-hoc signing DOES do is make
    # the process merely *signed*, which is enough to satisfy Keychain's
    # baseline requirement for a plain, ungrouped item — see the accompanying
    # fix in Sources/Store/Credentials.swift, which stopped asking for an
    # explicit access group. The two fixes only work together. App Group
    # (Sources/Store/SharedContainer.swift) resolution was separately
    # confirmed to still work on Simulator regardless of this signing change
    # — Simulator does not enforce that entitlement the way a real device
    # does — but that is Simulator leniency, not evidence the App Group
    # entitlement is genuinely wired; a real device with a real Apple
    # Developer Team is the only environment that actually proves it. See
    # mobile/ios/Tests/CredentialsTests.swift and mobile/README.md's manual
    # checklist.
    #
    # Supervisor push (APNs alerts + push-to-start Live Activities) needs a
    # real Apple Developer Team: set DEVELOPMENT_TEAM, enable Push
    # Notifications on the sh.openagi.OpenAGI App ID, and sign with a profile.
    # The aps-environment entitlement below is declared unconditionally:
    # ad-hoc ("-") Simulator builds still build and run with it, and without
    # a team the app simply never completes push registration (it fails
    # quietly and the rest of the app is unaffected). See mobile/README.md's
    # "Supervisor push (iOS)" section.
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # App Group ids are global across Apple teams; a team that cannot
    # register this one overrides it (xcodebuild OPENAGI_APP_GROUP=...).
    OPENAGI_APP_GROUP: group.sh.openagi.mobile
    # Bundle ids are global too; the extensions derive theirs from it.
    OPENAGI_BUNDLE_ID: sh.openagi.OpenAGI
targets:
  OpenAGI:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: OpenAGI
        OpenAGIAppGroup: $(OPENAGI_APP_GROUP)
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: sh.openagi.pair
            CFBundleURLSchemes: [openagi]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: OpenAGI talks to the daemon on your own machine.
        BGTaskSchedulerPermittedIdentifiers: [sh.openagi.refresh]
        UIBackgroundModes: [fetch, remote-notification]
        NSSupportsLiveActivities: true
        # Self-hosted push relay; empty means https://push.openagi.sh.
        OpenAGIPushRelay: $(OPENAGI_PUSH_RELAY)
    entitlements:
      path: Sources/OpenAGI.entitlements
      properties:
        com.apple.security.application-groups: [$(OPENAGI_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)sh.openagi.mobile]
        # Archive/export rewrites this to "production" from the
        # distribution profile.
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OPENAGI_BUNDLE_ID)
        OPENAGI_PUSH_RELAY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: OpenAGIWidget
        embed: true
      - target: OpenAGINotify
        embed: true
  OpenAGIWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Protocol
      - path: Sources/Store
      - path: Sources/UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OPENAGI_BUNDLE_ID).OpenAGIWidget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: OpenAGI Today
        OpenAGIAppGroup: $(OPENAGI_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/OpenAGIWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(OPENAGI_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)sh.openagi.mobile]
  # Notification Service Extension: decrypts a supervisor alert and adds its
  # answer buttons. Shares the keychain group (push key) with the app and
  # widget; compiles only the push files it needs.
  OpenAGINotify:
    type: app-extension
    platform: iOS
    sources:
      - path: Notify
      - path: Sources/Protocol/PushEnvelope.swift
      - path: Sources/Protocol/SupervisorPushContent.swift
      - path: Sources/Store/PushKeyStore.swift
      - path: Sources/Notifications/SupervisorCategories.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OPENAGI_BUNDLE_ID).OpenAGINotify
    info:
      path: Notify/Info.plist
      properties:
        CFBundleDisplayName: OpenAGI Notify
        OpenAGIAppGroup: $(OPENAGI_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Notify/OpenAGINotify.entitlements
      properties:
        com.apple.security.application-groups: [$(OPENAGI_APP_GROUP)]
        keychain-access-groups: [$(AppIdentifierPrefix)sh.openagi.mobile]
  OpenAGITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: OpenAGI
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
    info:
      path: Tests/Info.plist
schemes:
  OpenAGI:
    build:
      targets:
        OpenAGI: all
    test:
      targets: [OpenAGITests]
