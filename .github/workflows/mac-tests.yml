name: Mac tests

on:
  pull_request:
    paths:
      - "mac/**"
      - "src/phone-pairing-page.js"
      - "src/hosted-interface.js"
      - "src/chatgpt-auth.js"
      - "src/model-setup-ui.js"
      - "test/phone-pairing-page.test.js"
      - "test/chatgpt-auth.test.js"
      - "test/model-setup.test.js"
      - ".github/workflows/mac-tests.yml"

permissions:
  contents: read

jobs:
  fleet-tests:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Mac app and run Fleet and privacy-link regressions
        run: swift test --package-path mac --filter 'Fleet|AppLink|PhonePairing|PendingApproval'

  onboarding-and-pairing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test --test-concurrency=1 test/chatgpt-auth.test.js test/model-setup.test.js test/phone-pairing-page.test.js test/dashboard-login.test.js test/mobile-enrollment.test.js test/pair-phone.test.js
