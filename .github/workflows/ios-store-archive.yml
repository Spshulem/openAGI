name: iOS App Store archive
on:
  pull_request:
    paths:
      - .github/workflows/ios-store-archive.yml
permissions:
  contents: read
jobs:
  archive:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Release source is the verified main commit, not the workflow PR.
          ref: e54d5196c4ff7067786d2c2802daa9d042312dce
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - name: Verify release toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | grep -Fx 'Build version 27A9275'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - run: mobile/ios/scripts/fetch-node-runtime.sh
      - name: Generate project
        run: |
          command -v xcodegen || brew install xcodegen
          cd mobile/ios
          xcodegen generate
      - name: Archive release for distribution signing
        working-directory: mobile/ios
        run: |
          xcodebuild archive -project OpenAGI.xcodeproj -scheme OpenAGI \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OpenAGI.xcarchive" \
            CURRENT_PROJECT_VERSION=2130 DEVELOPMENT_TEAM=38HE3W7T5K \
            OPENAGI_BUNDLE_ID=com.spencershulem.openagi \
            OPENAGI_APP_GROUP=group.com.spencershulem.openagi \
            CODE_SIGNING_ALLOWED=NO
          test -f "$RUNNER_TEMP/OpenAGI.xcarchive/Products/Applications/OpenAGI.app/Frameworks/NodeMobile.framework/NodeMobile"
          ditto -c -k --keepParent "$RUNNER_TEMP/OpenAGI.xcarchive" "$RUNNER_TEMP/OpenAGI-2130-archive.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAGI-2130-archive
          path: ${{ runner.temp }}/OpenAGI-2130-archive.zip
          retention-days: 7

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e54d5196c4ff7067786d2c2802daa9d042312dce
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build unsigned store artifacts
        working-directory: mobile/android
        run: ./gradlew --no-daemon --max-workers=2 bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAGI-android-0.1.8-release-unsigned
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
