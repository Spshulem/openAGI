name: Android mobile

on:
  pull_request:
    paths:
      - "mobile/**"
      - "src/**"
      - "package*.json"
      - "relay/**"
      - ".github/workflows/mobile-*.yml"
      - ".github/workflows/push-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test, lint, and build Android app
        working-directory: mobile/android
        run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenAGI-android-results-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            mobile/android/app/build/test-results/
            mobile/android/app/build/reports/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAGI-android-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
