name: Android mobile

on:
  pull_request:
    paths:
      - "mobile/**"
      - "src/**"
      - "package*.json"
      - "relay/**"
      - ".github/workflows/mobile-*.yml"
      - ".github/workflows/push-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Test, lint, and build Android app
        working-directory: mobile/android
        run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenAGI-android-results-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            mobile/android/app/build/test-results/
            mobile/android/app/build/reports/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: OpenAGI-android-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: OpenAGI-android-instrumentation-${{ github.event.pull_request.head.sha || github.sha }}
          path: mobile/android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  foldable-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test foldable layouts on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          # Postures are injected by the tests; use an SDK-bundled profile
          # with a large display rather than a vendor-specific AVD name.
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 2208x1840
          script: |
            ./mobile/android/gradlew -p mobile/android --no-daemon --max-workers=2 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true connectedDebugAndroidTest
            adb pull /sdcard/Android/data/sh.openagi.mobile/files/foldable-screenshots "$RUNNER_TEMP/foldable-screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenAGI-foldable-layout-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/foldable-screenshots/
          retention-days: 7
