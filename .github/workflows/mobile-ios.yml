name: iOS mobile

on:
  pull_request:
    paths:
      - "mobile/**"
      - "src/**"
      - "bin/mobile-entry.mjs"
      - "examples/skills/**"
      - "package*.json"
      - "relay/**"
      - ".github/workflows/mobile-*.yml"
      - ".github/workflows/push-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # 27.2 links the native Duo vertical bars and reserved-region APIs with the supported App Store SDK.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Verify Xcode 27.2 toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | grep -Fx 'Xcode 27.2'
          xcodebuild -version | grep -Fx 'Build version 27B52'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - run: npm ci --omit=dev --ignore-scripts
      - name: Fetch embedded runtime
        run: mobile/ios/scripts/fetch-node-runtime.sh
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - name: Generate iOS project
        working-directory: mobile/ios
        run: xcodegen generate
      # Capture-only branch: App Store screenshots of the shipping views with
      # fictional data. Not for merge.
      - name: Capture store screenshots
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/rt.json"
          pick() {
            device_type=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; n=sys.argv[1]; print(next(d["identifier"] for d in json.load(sys.stdin)["devicetypes"] if d["name"]==n or (n.endswith("*") and d["name"].startswith(n[:-1]))))' "$1")
            runtime=$(python3 -c 'import json,sys; rows=json.load(open(sys.argv[1]))["runtimes"]; c=[r for r in rows if r.get("isAvailable") and int(r["version"].split(".")[0])>=27 and any(d["identifier"]==sys.argv[2] for d in r.get("supportedDeviceTypes",[]))]; print(max(c,key=lambda r: tuple(map(int,r["version"].split("."))))["identifier"] if c else "")' "$RUNNER_TEMP/rt.json" "$device_type")
            if [ -z "$runtime" ]; then xcodebuild -downloadPlatform iOS -buildVersion 27.2; xcrun simctl list runtimes -j > "$RUNNER_TEMP/rt.json"; runtime=$(python3 -c 'import json,sys; rows=json.load(open(sys.argv[1]))["runtimes"]; c=[r for r in rows if r.get("isAvailable") and int(r["version"].split(".")[0])>=27 and any(d["identifier"]==sys.argv[2] for d in r.get("supportedDeviceTypes",[]))]; print(max(c,key=lambda r: tuple(map(int,r["version"].split("."))))["identifier"])' "$RUNNER_TEMP/rt.json" "$device_type"); fi
            xcrun simctl create "$2" "$device_type" "$runtime"
          }
          xcodebuild build-for-testing -project OpenAGI.xcodeproj -scheme OpenAGI -configuration Debug \
            -destination "generic/platform=iOS Simulator" -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES
          status=0
          for spec in "iPhone 17 Pro Max|store-iphone" "iPad Pro 13-inch*|store-ipad"; do
            name="${spec%%|*}"; label="${spec##*|}"
            sim=$(pick "$name" "OpenAGI $label")
            xcrun simctl boot "$sim"; xcrun simctl bootstatus "$sim" -b
            xcrun simctl status_bar "$sim" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
            xcodebuild test-without-building -project OpenAGI.xcodeproj -scheme OpenAGI -configuration Debug \
              -destination "platform=iOS Simulator,id=$sim" -derivedDataPath "$RUNNER_TEMP/dd" \
              -resultBundlePath "$RUNNER_TEMP/$label.xcresult" \
              -only-testing:OpenAGIUITests/StoreScreenshotTests \
              -parallel-testing-enabled NO -collect-test-diagnostics never || status=1
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$label.xcresult" --output-path "$RUNNER_TEMP/store-shots/$label" || true
            xcrun simctl shutdown "$sim" || true; xcrun simctl delete "$sim" || true
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-shots-${{ github.sha }}
          path: ${{ runner.temp }}/store-shots
          retention-days: 7
