name: iOS mobile

on:
  pull_request:
    paths:
      - "mobile/**"
      - "src/**"
      - "bin/mobile-entry.mjs"
      - "examples/skills/**"
      - "package*.json"
      - "relay/**"
      - ".github/workflows/mobile-*.yml"
      - ".github/workflows/push-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
      - run: npm ci --omit=dev --ignore-scripts
      - name: Fetch embedded runtime
        run: mobile/ios/scripts/fetch-node-runtime.sh
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - name: Generate iOS project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Build and test iOS app
        working-directory: mobile/ios
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/openagi-simulators.json"
          simulator_id=$(python3 -c 'import json,sys; devices=json.load(open(sys.argv[1]))["devices"]; print(next(d["udid"] for runtime, rows in sorted(devices.items(), reverse=True) if ".iOS-" in runtime for d in rows if d.get("isAvailable") and d["name"].startswith("iPhone")))' "$RUNNER_TEMP/openagi-simulators.json")
          xcodebuild test \
            -project OpenAGI.xcodeproj \
            -scheme OpenAGI \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$RUNNER_TEMP/openagi-ios-simulator" \
            -resultBundlePath "$RUNNER_TEMP/OpenAGI-tests.xcresult" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES
      - name: Verify simulator runtime was bundled
        run: test -f "$RUNNER_TEMP/openagi-ios-simulator/Build/Products/Debug-iphonesimulator/OpenAGI.app/Frameworks/NodeMobile.framework/NodeMobile"
      - name: Package simulator app
        run: |
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/openagi-ios-simulator/Build/Products/Debug-iphonesimulator/OpenAGI.app" \
            "$RUNNER_TEMP/OpenAGI-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAGI-simulator-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/OpenAGI-simulator.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenAGI-test-results-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/OpenAGI-tests.xcresult
          retention-days: 7
      - name: Build device app for local signing and QA
        working-directory: mobile/ios
        run: |
          xcodebuild build \
            -project OpenAGI.xcodeproj \
            -scheme OpenAGI \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/openagi-ios-device" \
            CODE_SIGNING_ALLOWED=NO
          test -f "$RUNNER_TEMP/openagi-ios-device/Build/Products/Debug-iphoneos/OpenAGI.app/Frameworks/NodeMobile.framework/NodeMobile"
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/openagi-ios-device/Build/Products/Debug-iphoneos/OpenAGI.app" \
            "$RUNNER_TEMP/OpenAGI-device-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAGI-device-unsigned-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/OpenAGI-device-unsigned.zip
          retention-days: 7
